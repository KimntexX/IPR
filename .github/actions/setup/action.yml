name: Native dependencies
description: Install native toolchain and expose build arguments
inputs:
  mode:
    description: system or standalone
    default: system
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.14'
    - shell: bash
      run: python -m pip install 'numpy>=2.2,<3' 'Pillow>=11,<13' 'PyYAML>=6,<7'
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build libopencv-dev libraw-dev libtiff-dev libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libegl1
    # Ubuntu 24.04 ships Qt 6.4.2, below the Qt 6.8 minimum: Linux always uses the SDK.
    - if: runner.os == 'Windows' || runner.os == 'Linux' || (runner.os == 'macOS' && inputs.mode == 'standalone')
      uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
      with:
        version: '6.8.3'
        arch: ${{ runner.os == 'Windows' && 'win64_msvc2022_64' || runner.os == 'macOS' && 'clang_64' || 'linux_gcc_64' }}
        setup-python: false
        cache: true
        modules: qtimageformats
    - if: runner.os == 'Windows'
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        repository: microsoft/vcpkg
        ref: e456309491fd875487bf02b8a0dca76c1b1b00cc
        path: build-tools/vcpkg
        persist-credentials: false
    - if: runner.os == 'Windows'
      shell: pwsh
      run: |
        & ./build-tools/vcpkg/bootstrap-vcpkg.bat -disableMetrics
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        "IPR_VCPKG_ROOT=$env:GITHUB_WORKSPACE/build-tools/vcpkg" >> $env:GITHUB_ENV
    - if: runner.os == 'macOS'
      shell: bash
      env:
        IPR_DEPLOY_MODE: ${{ inputs.mode }}
      run: |
        brew install cmake ninja opencv libraw libtiff
        if [[ "$IPR_DEPLOY_MODE" == system ]]; then
          brew install qt
          echo "QT_ROOT_DIR=$(brew --prefix qt)" >> "$GITHUB_ENV"
        fi
    - name: Dependency versions
      shell: bash
      run: |
        mkdir -p ci-logs
        python --version > ci-logs/dependencies.txt
        cmake --version >> ci-logs/dependencies.txt
        python -m pip freeze >> ci-logs/dependencies.txt
        if command -v brew >/dev/null; then brew list --versions >> ci-logs/dependencies.txt; fi
        if command -v dpkg-query >/dev/null; then dpkg-query -W >> ci-logs/dependencies.txt; fi
