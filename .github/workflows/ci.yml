name: CI native full tests
on:
  push:
    branches: [main, dev, 'patch_*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: python scripts/github_build.py --action build --mode system
      - run: python scripts/github_build.py --action test --mode system
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tests-${{ matrix.os }}
          path: |
            build-ci/test-results/
            build-ci/Testing/Temporary/
            build-ci/CMakeFiles/CMakeConfigureLog.yaml
            ci-logs/
          retention-days: 14
