name: CI scoped validation
on:
  push:
    branches: [main, dev, 'patch_*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.scope.outputs.native }}
      python: ${{ steps.scope.outputs.python }}
      documents: ${{ steps.scope.outputs.documents }}
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        run: python scripts/ci_scope.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-logs-plan
          path: ci-logs/test-plan.json
          if-no-files-found: error
  documents:
    needs: scope
    if: needs.scope.outputs.documents == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python scripts/ci_documents.py
  python:
    needs: scope
    if: needs.scope.outputs.python == 'true' && needs.scope.outputs.native != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python -m pip install 'numpy>=2.2,<3' 'Pillow>=11,<13' 'PyYAML>=6,<7'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: test-logs-plan
          path: ci-logs/
      - run: python scripts/ci.py --action python --test-plan ci-logs/test-plan.json
  native:
    needs: scope
    if: needs.scope.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: test-logs-plan
          path: ci-logs/
      - uses: ./.github/actions/setup
      - run: python scripts/github_build.py --action build --mode system --test-plan ci-logs/test-plan.json
      - run: python scripts/github_build.py --action test --mode system --test-plan ci-logs/test-plan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: test-logs-${{ matrix.os }}
          path: |
            build-ci/test-results/
            build-ci/Testing/Temporary/
            build-ci/CMakeFiles/CMakeConfigureLog.yaml
            ci-logs/
          retention-days: 14
  validation:
    name: CI validation
    needs: [scope, documents, python, native]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Reject failed, canceled or unexpectedly skipped checks
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          DOCUMENTS_RESULT: ${{ needs.documents.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          EXPECT_DOCUMENTS: ${{ needs.scope.outputs.documents }}
          EXPECT_PYTHON: ${{ needs.scope.outputs.python }}
          EXPECT_NATIVE: ${{ needs.scope.outputs.native }}
        run: |
          python - <<'PY'
          import os
          expected = {'SCOPE': True, 'DOCUMENTS': os.environ['EXPECT_DOCUMENTS'] == 'true',
                      'NATIVE': os.environ['EXPECT_NATIVE'] == 'true',
                      'PYTHON': os.environ['EXPECT_PYTHON'] == 'true' and os.environ['EXPECT_NATIVE'] != 'true'}
          for job, required in expected.items():
              result = os.environ[job + '_RESULT']
              assert result == ('success' if required else 'skipped'), f'{job}: {result}'
          PY
  packaging-check:
    name: Packaging verification (${{ matrix.os }}, ${{ matrix.mode }})
    needs: validation
    if: github.ref == 'refs/heads/patch_ci_cd' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-15, macos-15-intel]
        mode: [system, standalone]
        # No Qt >= 6.8 system package on Ubuntu 24.04: standalone only there.
        exclude:
          - os: ubuntu-24.04
            mode: system
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          mode: ${{ matrix.mode }}
      - shell: bash
        env:
          IPR_MODE: ${{ matrix.mode }}
        run: python scripts/github_build.py --action all --mode "$IPR_MODE" --verify-package-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: test-logs-packaging-${{ matrix.os }}-${{ matrix.mode }}
          path: |
            build-ci/test-results/
            build-ci/Testing/Temporary/
            build-ci/CMakeFiles/CMakeConfigureLog.yaml
            ci-logs/
          retention-days: 14
