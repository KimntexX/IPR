; Default UI preferences. Runtime copy: AppConfigLocation/ipr-ui.ini.
; Edit the runtime file while IPR is closed. This is not an image sidecar.

[meta]
schemaVersion=2

[window]
normalWidth=1440
normalHeight=900
normalX=0
normalY=0
positionSaved=false
state=normal

[theme]
background=#20242b
panel=#2a3039
canvas=#15181d
text=#edf2f8
secondaryText=#d7dfeb

[layout]
settingsWidth=320
imageInfoWidth=250
filmstripHeight=120
showImageInfo=true
showHistogram=true
showFilmstrip=true

[sections]
light=true
curves=false
color=false
mixer=false
grading=false
effects=false
denoise=false
sharpening=false
export=false

[selection]
toneCurveChannel=0
mixerBand=0
gradingZone=0

[export]
format=JPEG
quality=92

; Reserved only: these keys are NOT consumed by the current engine or UI.
[future]
cropGrid=thirds
maskOverlayColor=#80e55353
maskOverlayOpacity=0.45
aiEnabled=false
gpuBackend=auto
catalogEnabled=false
exportQueueConcurrency=1
